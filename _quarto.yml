# Mirrors the structure of aml4td/website's _quarto.yml, trimmed to the parts
# that actually affect dev-preview publishing. See plans/ in that repo.
project:
  type: book
  preview:
    port: 3764

## Global options that can be re-defined in each qmd file
format:
  html:
    toc: true
    theme: [simplex, includes/testbed.scss]
    fig-width: 6
    fig-height: 4.25
    fig-align: center
    keep-md: false
    html-math-method: katex

crossref:
  custom:
    - kind: float
      reference-prefix: Algorithm
      key: alg

execute:
  freeze: auto
  keep-md: false
  echo: false

# The hazard under test: CNAME names the *production* domain and is copied into
# every render, including preview renders. publish-dev.sh must delete it before
# syncing, or the staging repo would try to claim this domain.
resources:
  - CNAME

book:
  title: "Dev Preview Testbed"
  author:
    - name: Max Kuhn
  date: last-modified
  date-format: YYYY-MM-DD
  # Production URL, as in the real book. Preview builds override this via a
  # generated Quarto profile; nothing here is ever published to production.
  site-url: https://warm-bread-coffin.org
  sharing: [twitter, linkedin]
  google-analytics: "G-TESTBED0000"
  sidebar:
    style: "docked"
    collapse-level: 1
  reader-mode: true
  bread-crumbs: false
  chapters:
    - index.qmd
    - part: "Preparation"
      chapters:
        - chapters/intro.qmd
    - part: "Modeling"
      chapters:
        - chapters/analysis.qmd
